first_party_standard:
  name: Acin Data Technical Standards (DTS)
  url: https://acin-documentation-prd01.azureedge.net/docs/intro
  detail: >-
    A first-party, publicly documented data standard for non-financial risk covering 33 entities
    (Control, Risk, Process, RiskInventory, Regulation, Regulator, Penalty, PeerGroup,
    NetworkMember and their join entities), each with typed properties and example JSON. It is a
    data model, not an API contract — no schema file is published for it.
