domain_standard:
  declared: false
  detail: >-
    Acin's market — bank operational and non-financial risk — does have industry reference
    taxonomies (ORX for operational-risk loss and taxonomy exchange, the Basel operational-risk
    event-type categories). Acin's published Data Technical Standards documentation names none of
    them: it presents the DTS as its own industry-sourced standard, defined and maintained by the
    company for its client network. No external domain standard is declared in the contract or in
    the data dictionary, and none is asserted here.
