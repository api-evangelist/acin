aid: acin
name: Acin
description: >-
  Acin is a London-based operational and non-financial risk (NFR) data company for financial
  services, founded in 2018 and acquired by regulatory-intelligence firm CUBE in June 2025. Its
  platform ingests a bank's process, risk and control inventories, standardises them against Acin's
  published Data Technical Standards — a documented model of Controls, Risks, Processes, Risk
  Inventories, Regulations, Regulators and Penalties — and benchmarks them anonymously across a
  peer network of tier-one banks, turning control assessment from a qualitative exercise into a
  quantified one. Acin is backed by Barclays, BNP Paribas, Citi, J.P. Morgan, Lloyds Banking Group,
  Fitch Ventures, Notion Capital and Talis Capital, and is listed on the Microsoft Azure
  Marketplace. It is delivered as a tenant-gated web platform at app.acin.com backed by an Azure
  API Management GraphQL gateway; there is no public developer program or machine-readable
  contract.
