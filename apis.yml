apis:
- aid: acin:acin-platform-graphql-gateway
  name: Acin Platform GraphQL Gateway
  description: >-
    The GraphQL gateway that backs the Acin / CUBE Platform web application. It is served from
    Acin's own Azure API Management instance at apim-prod.acin.com and is referenced by name in the
    application bundle that app.acin.com serves publicly. Every request requires an OAuth 2.0
    bearer token issued by Acin's Auth0 tenant at app-auth.acin.com; an anonymous request — GET or
    a POST carrying a GraphQL introspection query — returns HTTP 401
    {"statusCode":401,"message":"Authorization token is missing or invalid"}. No schema, SDL, or
    reference for this endpoint is published anywhere public, so the surface is recorded here as
    observed and gated, not described. Acin publishes no OpenAPI, AsyncAPI, or GraphQL SDL.
  humanURL: https://acin-documentation-prd01.azureedge.net/docs/intro
  baseURL: https://apim-prod.acin.com/v1/gateway-graphql
