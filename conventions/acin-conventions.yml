reversibility:
  grade: unknown
  detail: >-
    Acin's platform has a substantial write surface — the Q1 2025 and Q2 2025 release notes
    describe creating controls from policy documents, rewriting unclear controls, merging duplicate
    controls, and actioning identified control gaps — and merging or rewriting a bank's control
    inventory is exactly the class of action an agent would need to know it can undo. No reversal
    operation, undo, restore, or retention window is documented on any public surface, and the
    contract that would name one is not published. This is recorded as unknown, not `none` and not
    `na`: the write surface certainly exists, but nothing public states whether it is reversible,
    and asserting a window that Acin has not published would be the one error in this pipeline that
    could cost a user their control inventory.
  reversal_operations: []
  windows: []
