source: >-
  Anonymous HTTPS probes of /.well-known/ paths on every host this record knows — the registrable
  domain and www, the platform SPA host, the Azure API Management gateway host that backs it, the
  Auth0 custom-domain authorization server it authenticates against, and the documentation CDN.
note: >-
  Only app-auth.acin.com serves anything. It is Acin's Auth0 custom domain (issuer
  "https://app-auth.acin.com/") and publishes OIDC discovery, the RFC 8414 OAuth authorization
  server metadata, and the signing JWKS. Every other host — including the marketing site and the
  API gateway — returns 404 on every probed path; www.acin.com answers 404 with a WordPress HTML
  error page, api.acin.com and apim-prod.acin.com with JSON 404s. No security.txt, no api-catalog,
  and no ai-plugin.json anywhere.
