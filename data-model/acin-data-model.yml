ownership_note: acin-documentation-prd01.azureedge.net is Acin's own Azure CDN endpoint — it is named
  for the company and is declared in the Content-Security-Policy frame-src of Acin's own application at
  app.acin.com as that application's in-product documentation. The pages are branded "Cube Documentation"
  because CUBE acquired Acin in June 2025 and the platform at app.acin.com now titles itself "CUBE Platform";
  this is a parent-brand case, not a different product.
name: Acin Data Technical Standards (DTS)
summary: Acin's published data model for non-financial risk. The DTS defines the Process, Risk and Control
  constructs — plus regulations, regulators, penalties, peer groups and the anonymised benchmarking network
  — that the Acin platform ingests, standardises and benchmarks against. Most facts are split into a stable
  Fact record (Id, Code, IsDeleted, IsApproved, AuditId) and a versioned Instance record carrying the
  descriptive attributes, with the Instance pointing back at its Fact via a <Entity>Id field.
format: Documented entity/property tables with example JSON payloads; no OpenAPI, JSON Schema or GraphQL
  SDL is published for it.
entity_count: 33
relationship_count: 46
identifier_convention: GUID surrogate key named Id on every entity (documented as internal, not for external
  reference); a STRING Code field carries the business identifier.
audit_convention: Every entity carries AuditId, a GUID reference to an audit change-control record (entity
  Audit).
